[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-home-inventory"
version = "1.0.0"
description = "Autonomous Multimodal Home Inventory & Insurance Proof-of-Purchase Pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Open Home Inventory Contributors" }
]
keywords = [
    "home-inventory",
    "multimodal-ai",
    "computer-vision",
    "receipt-scraping",
    "insurance-audit",
    "local-llm",
    "ollama"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Multimedia :: Graphics"
]
dependencies = [
    "pydantic>=2.0.0",
    "pillow>=9.5.0",
    "requests>=2.28.0",
    "pyyaml>=6.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "jinja2>=3.1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "flake8>=6.0.0"
]

[project.scripts]
inventory-ai = "src.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

